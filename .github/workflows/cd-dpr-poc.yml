name: CD + ServiceNow DPR (POC)

# Pipeline dummy: cada job representa um stage de CD e, no fim, faz avançar
# a fase correspondente da release no ServiceNow Digital Product Release.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   SN_INSTANCE   ex: https://dev437812.service-now.com
#   SN_USER       utilizador de integração (product_manager ou release_admin)
#   SN_PASS
#
# Variables (Settings > Secrets and variables > Actions > Variables):
#   DPR_TEMPLATE_ID, DPR_PRODUCT_ID, DPR_RELEASE_OWNER  (opcional: já têm os sys_ids da PDI por omissão)
#   DPR_START_ENDPOINT    opcional; por omissão /api/2076683/dpr_poc/release/{id}/start  ({id} = releaseId criado)
#   DPR_COMPLETE_ENDPOINT ex: /api/2076683/dpr_poc/release/{id}/complete  (vazio = complete manual no Workspace)
#   DPR_PHASES          nomes das 3 fases por ordem, ex: "Build,Test,Deploy"
#   DPR_PHASE_BUILD, DPR_PHASE_TEST, DPR_PHASE_DEPLOY  (nome da fase que cada stage fecha)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a lançar (ex: 2.4)"
        required: true
        default: "0.1.0"

env:
  SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
  SN_USER: ${{ secrets.SN_USER }}
  SN_PASS: ${{ secrets.SN_PASS }}
  DPR_PHASES: ${{ vars.DPR_PHASES }}

jobs:
  create-release:
    name: 1. Criar e iniciar release
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.create.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciais do ServiceNow
        run: bash scripts/dpr.sh check-auth

      - name: Criar release no DPR
        id: create
        env:
          # Valores por omissão = sys_ids da PDI; podem ser sobrepostos por repository variables
          DPR_TEMPLATE_ID: ${{ vars.DPR_TEMPLATE_ID || '899d784493c49710ec56367f3bba10fb' }}
          DPR_PRODUCT_ID: ${{ vars.DPR_PRODUCT_ID || 'e6a760ad93334714ec56367f3bba1022' }}
          DPR_RELEASE_OWNER: ${{ vars.DPR_RELEASE_OWNER || 'f39ddda3936b83d0ec56367f3bba109a' }}
        run: |
          ID=$(bash scripts/dpr.sh create "POC ${{ inputs.version }} (run ${{ github.run_number }})" "${{ inputs.version }}")
          echo "releaseId=$ID" >> "$GITHUB_OUTPUT"
          echo "Release criada: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Iniciar release (Pending -> In Progress)
        env:
          DPR_START_ENDPOINT: ${{ vars.DPR_START_ENDPOINT || '/api/2076683/dpr_poc/release/{id}/start' }}
        run: bash scripts/dpr.sh start "${{ steps.create.outputs.releaseId }}"

      - name: Confirmar que está In Progress
        run: bash scripts/dpr.sh wait-started "${{ steps.create.outputs.releaseId }}"

  build:
    name: 2. Build (dummy) + gate DPR
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dummy
        run: |
          echo "A compilar versão ${{ inputs.version }}..."
          sleep 5
          echo "Build OK"
      - name: Gate DPR — completar fase 1
        run: bash scripts/dpr.sh gate "${{ needs.create-release.outputs.releaseId }}" "${{ vars.DPR_PHASE_BUILD }}"

  test:
    name: 3. Testes (dummy) + gate DPR
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes dummy
        run: |
          echo "A correr testes..."
          sleep 5
          echo "42 testes, 0 falhas"
      - name: Gate DPR — completar fase 2
        run: bash scripts/dpr.sh gate "${{ needs.create-release.outputs.releaseId }}" "${{ vars.DPR_PHASE_TEST }}"

  deploy:
    name: 4. Deploy (dummy) + gate DPR
    needs: [create-release, test]
    runs-on: ubuntu-latest
    environment: production   # opcional: ativa aprovação manual no GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Deploy dummy
        run: |
          echo "A fazer deploy da ${{ inputs.version }}..."
          sleep 5
          echo "Deploy OK"
      - name: Gate DPR — completar fase 3
        run: bash scripts/dpr.sh gate "${{ needs.create-release.outputs.releaseId }}" "${{ vars.DPR_PHASE_DEPLOY }}"
      - name: Completar release (Review -> Completed)
        env:
          DPR_COMPLETE_ENDPOINT: ${{ vars.DPR_COMPLETE_ENDPOINT }}
        run: bash scripts/dpr.sh complete "${{ needs.create-release.outputs.releaseId }}"
      - name: Estado final
        if: always()
        run: bash scripts/dpr.sh status "${{ needs.create-release.outputs.releaseId }}"
